<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="topbar">
    <nav class="navbar navbar-expand-lg border-bottom bg-body-tertiary shadow-sm">
        <div class="container-fluid">
            <button class="btn btn-outline-secondary" type="button" id="sidebarToggle" aria-label="Alternar menú">
                <i class="bi bi-list"></i>
            </button>
            <div class="d-flex align-items-center ms-auto gap-2">
                <button class="btn btn-outline-secondary" id="themeToggle" type="button" aria-label="Cambiar tema">
                    <i class="bi bi-sun"></i>
                </button>
                <div class="dropdown">
                    <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-2"></i>
                        <span sec:authentication="name">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                <button type="submit" class="btn btn-link text-danger p-0"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
