<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title layout:fragment="title">Panel</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1">Hola, <span th:text="${usuario} ?: 'Usuario'">Usuario</span></h1>
            <p class="text-muted mb-0">Bienvenido al panel de control de Binexus ERP.</p>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h6 text-muted">KPI 1</h2>
                    <p class="display-6 fw-semibold">--</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h6 text-muted">KPI 2</h2>
                    <p class="display-6 fw-semibold">--</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h6 text-muted">KPI 3</h2>
                    <p class="display-6 fw-semibold">--</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h6 text-muted">KPI 4</h2>
                    <p class="display-6 fw-semibold">--</p>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
