<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Nuevo local</title>
</head>
<body layout:decorate="~{layout}">
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-0">Registrar local</h1>
            <p class="text-muted mb-0">Asocia nuevos locales a tus organizaciones.</p>
        </div>
        <a th:href="@{/admin/organizations}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/locals}" th:object="${local}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="organizacion" class="form-label">Organización</label>
                    <select id="organizacion" class="form-select" th:field="*{organizacionId}">
                        <option value="" disabled selected>Selecciona…</option>
                        <option th:each="org : ${organizaciones}" th:value="${org.id}" th:text="${org.nombre}"></option>
                    </select>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('organizacionId')}" th:errors="*{organizacionId}"></div>
                </div>
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre del local</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}" placeholder="Casa Matriz">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="col-md-4">
                    <label for="estado" class="form-label">Estado</label>
                    <select id="estado" class="form-select" th:field="*{estado}">
                        <option th:each="estado : ${T(cl.gob.binexus.domain.enums.EstadoLocal).values()}"
                                th:value="${estado}" th:text="${estado}"></option>
                    </select>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
