<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Organizaciones</title>
</head>
<body layout:decorate="~{layout}">
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-0">Organizaciones</h1>
            <p class="text-muted mb-0">Visualiza y administra las organizaciones del sistema.</p>
        </div>
        <div class="btn-group">
            <a th:href="@{/admin/organizations/new}" class="btn btn-primary"><i class="bi bi-building-add me-2"></i>Nueva organización</a>
            <a th:href="@{/admin/locals/new}" class="btn btn-outline-primary"><i class="bi bi-geo-alt me-2"></i>Nuevo local</a>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Fecha creación</th>
                    <th>Locales</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${organizaciones.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4">No hay organizaciones registradas.</td>
                </tr>
                <tr th:each="org : ${organizaciones}">
                    <td th:text="${org.nombre}"></td>
                    <td>
                        <span class="badge" th:classappend="${org.estado.name() == 'ACTIVO'} ? ' bg-success-subtle text-success' : ' bg-secondary-subtle text-secondary'"
                              th:text="${org.estado}"></span>
                    </td>
                    <td th:text="${#temporals.format(org.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <ul class="list-unstyled mb-0 small" th:if="${!org.locales.isEmpty()}">
                            <li th:each="local : ${org.locales}" th:text="${local.nombre + ' (' + local.estado + ')'}"></li>
                        </ul>
                        <span class="text-muted" th:if="${org.locales.isEmpty()}">Sin locales</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/admin/organizations/' + ${org.id} + '/edit'}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
