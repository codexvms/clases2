<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Usuarios</title>
</head>
<body layout:decorate="~{layout}">
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-0">Gestión de usuarios</h1>
            <p class="text-muted mb-0">Administra los accesos y roles del sistema.</p>
        </div>
        <a th:href="@{/admin/users/new}" class="btn btn-primary"><i class="bi bi-person-plus me-2"></i>Nuevo usuario</a>
    </div>
    <form class="row g-2 align-items-end mb-3" method="get">
        <div class="col-md-4">
            <label for="search" class="form-label">Buscar</label>
            <input id="search" name="q" type="search" class="form-control" placeholder="Nombre o correo" th:value="${filtro}">
        </div>
        <div class="col-md-auto">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
        </div>
    </form>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Organización</th>
                    <th>Estado</th>
                    <th>Roles</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.totalElements == 0}">
                    <td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                </tr>
                <tr th:each="usuario : ${page.content}">
                    <td th:text="${usuario.nombre}"></td>
                    <td th:text="${usuario.correo}"></td>
                    <td th:text="${usuario.organizacion.nombre}"></td>
                    <td>
                        <span class="badge" th:classappend="${usuario.estado.name() == 'ACTIVO'} ? ' bg-success-subtle text-success' : ' bg-secondary-subtle text-secondary'"
                              th:text="${usuario.estado}"></span>
                    </td>
                    <td>
                        <span class="badge bg-primary-subtle text-primary me-1" th:each="rol : ${usuario.roles}" th:text="${rol.nombre}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/admin/users/' + ${usuario.id} + '/edit'}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center" th:if="${page.totalPages > 1}">
            <div class="text-muted small">Mostrando página <span th:text="${page.number + 1}"></span> de <span th:text="${page.totalPages}"></span></div>
            <nav>
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${page.first}? ' disabled'">
                        <a class="page-link" th:href="@{/admin/users(q=${filtro},page=${page.number - 1},size=${page.size})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? ' active'">
                        <a class="page-link" th:text="${i + 1}" th:href="@{/admin/users(q=${filtro},page=${i},size=${page.size})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${page.last}? ' disabled'">
                        <a class="page-link" th:href="@{/admin/users(q=${filtro},page=${page.number + 1},size=${page.size})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>
</body>
</html>
