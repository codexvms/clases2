<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title th:text="${usuario.id} != null ? 'Editar usuario' : 'Nuevo usuario'"></title>
</head>
<body layout:decorate="~{layout}">
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-0" th:text="${usuario.id} != null ? 'Editar usuario' : 'Nuevo usuario'"></h1>
            <p class="text-muted mb-0">Completa la información del usuario y asigna sus roles.</p>
        </div>
        <a th:href="@{/admin/users}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/users}" th:object="${usuario}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-6">
                    <label class="form-label" for="nombre">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Jane Doe">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="correo">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" th:field="*{correo}" placeholder="jane@binexus.com">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="••••••••">
                    <div class="form-text" th:if="${usuario.id != null}">Déjalo en blanco para mantener la contraseña actual.</div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="estado">Estado</label>
                    <select class="form-select" id="estado" th:field="*{estado}">
                        <option th:each="estado : ${T(cl.gob.binexus.domain.enums.EstadoUsuario).values()}"
                                th:value="${estado}" th:text="${estado}"></option>
                    </select>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="organizacion">Organización</label>
                    <select class="form-select" id="organizacion" th:field="*{organizacionId}">
                        <option value="" disabled>Selecciona…</option>
                        <option th:each="org : ${organizaciones}" th:value="${org.id}" th:text="${org.nombre}"></option>
                    </select>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('organizacionId')}" th:errors="*{organizacionId}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Roles</label>
                    <div class="row g-2">
                        <div class="col-md-4" th:each="rol : ${roles}">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{rolesIds}" th:value="${rol.id}" id="rol-[[${rol.id}]]">
                                <label class="form-check-label" th:for="${'rol-' + rol.id}" th:text="${rol.nombre}"></label>
                            </div>
                        </div>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('rolesIds')}" th:errors="*{rolesIds}"></div>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
