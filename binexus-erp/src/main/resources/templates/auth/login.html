<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Binexus ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card p-4 p-md-5 shadow-lg rounded-4 w-100" style="max-width: 420px;">
        <div class="text-center mb-4">
            <i class="bi bi-boxes display-4 text-primary"></i>
            <h1 class="h4 fw-bold mt-2">BINEXUS ERP</h1>
            <p class="text-muted mb-0">Bienvenido, ingresa tus credenciales</p>
        </div>
        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="username" name="username" placeholder="usuario@binexus.com" required autofocus>
                <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                <div class="invalid-feedback">La contraseña es obligatoria.</div>
            </div>
            <div th:if="${param.error}" class="alert alert-danger">Credenciales inválidas, intenta nuevamente.</div>
            <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente.</div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        <div class="text-center mt-4">
            <a th:href="@{/register}" class="small">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
