<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout}">
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h1 class="h3 mb-3" th:text="#{register.title}">Crear cuenta</h1>
            <div th:if="${success}" class="alert alert-success" th:text="#{message.user.created}"></div>
            <form th:action="@{/register}" th:object="${usuario}" method="post" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label" th:text="#{register.name}">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{register.email}">Correo</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{register.password}">Contraseña</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{register.confirm}">Crear cuenta</button>
            </form>
        </div>
    </div>
</section>
</html>
