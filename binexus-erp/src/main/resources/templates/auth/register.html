<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Binexus ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card p-4 p-md-5 shadow-lg rounded-4 w-100" style="max-width: 460px;">
        <div class="text-center mb-4">
            <h1 class="h4 fw-bold">Crear cuenta</h1>
            <p class="text-muted mb-0">Completa el formulario para solicitar acceso.</p>
        </div>
        <form class="row g-3">
            <div class="col-12">
                <label for="name" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="name" placeholder="Jane Doe" required>
            </div>
            <div class="col-12">
                <label for="email" class="form-label">Correo electrónico corporativo</label>
                <input type="email" class="form-control" id="email" placeholder="jane@binexus.com" required>
            </div>
            <div class="col-md-6">
                <label for="org" class="form-label">Organización</label>
                <input type="text" class="form-control" id="org" placeholder="Acme S.A." required>
            </div>
            <div class="col-md-6">
                <label for="role" class="form-label">Rol solicitado</label>
                <select id="role" class="form-select" required>
                    <option selected disabled value="">Selecciona…</option>
                    <option>Administrador</option>
                    <option>Gestor organización</option>
                    <option>Usuario</option>
                </select>
            </div>
            <div class="col-12">
                <label for="notes" class="form-label">Comentarios</label>
                <textarea class="form-control" id="notes" rows="3" placeholder="Cuéntanos sobre tu solicitud"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">Enviar solicitud</button>
            </div>
        </form>
        <div class="text-center mt-4">
            <a th:href="@{/login}" class="small">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
