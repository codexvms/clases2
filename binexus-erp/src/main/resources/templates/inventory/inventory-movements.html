<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Movimientos de inventario</title>
</head>
<body layout:decorate="~{layout}">
<section layout:fragment="content" class="col-lg-8 mx-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold">Movimientos de inventario</h1>
            <p class="text-muted mb-0">
                <span th:text="${inventario.producto.nombre}"></span> ·
                <span th:text="${inventario.organizacion.nombre}"></span>
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/inventario(organizacionId=${inventario.organizacion.id})}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th class="text-end">Cantidad</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${movimientos.isEmpty()}">
                        <td colspan="3" class="text-center text-muted py-4">Este inventario no registra movimientos todavía.</td>
                    </tr>
                    <tr th:each="mov : ${movimientos}">
                        <td th:text="${#temporals.format(mov.fechaMovimiento, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span class="badge" th:classappend="${mov.tipoMovimiento.name() == 'ENTRADA' ? ' bg-success-subtle text-success' : ' bg-danger-subtle text-danger'}"
                                  th:text="${mov.tipoMovimiento}"></span>
                        </td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(mov.cantidad, 0, 'COMMA', 2, 'POINT')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
