<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Producto</title>
</head>
<body layout:decorate="~{layout}">
<section layout:fragment="content" class="col-lg-8 mx-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold" th:text="${pageTitle}">Producto</h1>
            <p class="text-muted mb-0">Completa los datos del producto y define su precio vigente.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/productos}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>
    <form th:action="@{/productos}" th:object="${producto}" method="post" class="needs-validation" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-8">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required>
                <div class="invalid-feedback">El nombre es obligatorio.</div>
                <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="col-md-4">
                <label for="estado" class="form-label">Estado</label>
                <select id="estado" class="form-select" th:field="*{estado}">
                    <option th:each="estadoOpt : ${estados}" th:value="${estadoOpt}" th:text="${estadoOpt}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="organizacionId" class="form-label">Organización</label>
                <select id="organizacionId" class="form-select" th:field="*{organizacionId}" required>
                    <option value="">Selecciona una opción</option>
                    <option th:each="org : ${organizaciones}" th:value="${org.id}" th:text="${org.nombre}"></option>
                </select>
                <div class="invalid-feedback">Debes seleccionar una organización.</div>
            </div>
            <div class="col-md-6">
                <label for="stockInicial" class="form-label">Stock inicial</label>
                <input type="number" id="stockInicial" class="form-control" th:field="*{stockInicial}" min="0" step="0.01">
                <div class="text-danger small" th:if="${#fields.hasErrors('stockInicial')}" th:errors="*{stockInicial}"></div>
            </div>
            <div class="col-md-6">
                <label for="parametroId" class="form-label">Atributo / Marca</label>
                <select id="parametroId" class="form-select" th:field="*{parametroId}">
                    <option value="">Sin atributo</option>
                    <optgroup th:each="entry : ${parametrosPorTipo}" th:label="${entry.key}">
                        <option th:each="param : ${entry.value}" th:value="${param.id}" th:text="${param.descripcion}"></option>
                    </optgroup>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Precio unitario</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" th:field="*{precioUnitario}" min="0.01" step="0.01"
                           th:disabled="${!producto.nuevoPrecio && producto.id != null}">
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('precioUnitario')}" th:errors="*{precioUnitario}"></div>
                <div class="form-check mt-2" th:if="${producto.id != null}">
                    <input class="form-check-input" type="checkbox" id="nuevoPrecio" th:field="*{nuevoPrecio}">
                    <label class="form-check-label" for="nuevoPrecio">Registrar nuevo precio desde la fecha indicada</label>
                </div>
            </div>
            <div class="col-md-6">
                <label for="fechaInicioPrecio" class="form-label">Inicio vigencia precio</label>
                <input type="date" id="fechaInicioPrecio" class="form-control" th:field="*{fechaInicioPrecio}"
                       th:disabled="${!producto.nuevoPrecio && producto.id != null}">
            </div>
        </div>
        <div class="text-danger mt-3" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}"
             th:text="${err}"></div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-light" th:href="@{/productos}">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
        </div>
    </form>
</section>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const checkbox = document.getElementById('nuevoPrecio');
        const precioField = document.querySelector('[name="precioUnitario"]');
        const fechaField = document.getElementById('fechaInicioPrecio');
        if (!checkbox || !precioField || !fechaField) {
            return;
        }
        const toggleFields = () => {
            const enabled = checkbox.checked || !document.querySelector('[name="id"]').value;
            precioField.disabled = !enabled;
            fechaField.disabled = !enabled;
        };
        checkbox.addEventListener('change', toggleFields);
        toggleFields();
    });
</script>
</body>
</html>
