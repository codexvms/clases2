<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Ventas</title>
</head>
<body layout:decorate="~{layout}">
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold">Ventas</h1>
            <p class="text-muted mb-0">Consulta y filtra el historial de ventas.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/ventas/new}"><i class="bi bi-bag-plus me-1"></i>Nueva venta</a>
    </div>
    <form class="row g-3 mb-4" method="get" th:action="@{/ventas}">
        <div class="col-md-3">
            <label class="form-label" for="organizacionId">Organización</label>
            <select id="organizacionId" class="form-select" name="organizacionId">
                <option value="">Todas</option>
                <option th:each="org : ${organizaciones}" th:value="${org.id}" th:text="${org.nombre}"
                        th:selected="${organizacionId} == ${org.id}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="localId">Local</label>
            <select id="localId" class="form-select" name="localId">
                <option value="">Todos</option>
                <option th:each="loc : ${locales}" th:value="${loc.id}" th:text="${loc.nombre}"
                        th:selected="${localId} == ${loc.id}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="estadoPago">Estado pago</label>
            <select id="estadoPago" class="form-select" name="estadoPago">
                <option value="">Todos</option>
                <option th:each="estadoOpt : ${estadosPago}" th:value="${estadoOpt}" th:text="${estadoOpt}"
                        th:selected="${estadoPago} == ${estadoOpt}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="desde">Desde</label>
            <input type="date" id="desde" class="form-control" name="desde" th:value="${desde}">
        </div>
        <div class="col-md-2">
            <label class="form-label" for="hasta">Hasta</label>
            <input type="date" id="hasta" class="form-control" name="hasta" th:value="${hasta}">
        </div>
        <div class="col-12 d-flex justify-content-end gap-2">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search me-1"></i>Filtrar</button>
        </div>
    </form>
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Orden</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Local</th>
                        <th class="text-end">Total</th>
                        <th>Estado pago</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${ventas == null || ventas.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">No hay ventas registradas con los filtros seleccionados.</td>
                    </tr>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="${venta.orderId}"></td>
                        <td th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${venta.cliente.nombre}"></td>
                        <td th:text="${venta.local.nombre}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(venta.montoFinal, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span class="badge" th:classappend="${venta.estadoPago.name() == 'PAGADO' ? ' bg-success-subtle text-success' : (venta.estadoPago.name() == 'PENDIENTE' ? ' bg-warning-subtle text-warning' : ' bg-danger-subtle text-danger')}"
                                  th:text="${venta.estadoPago}"></span>
                        </td>
                        <td class="text-end">
                            <div class="btn-group">
                                <a class="btn btn-outline-secondary btn-sm" th:href="@{'/ventas/' + ${venta.id} + '/ticket'}" target="_blank"><i class="bi bi-printer"></i></a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
