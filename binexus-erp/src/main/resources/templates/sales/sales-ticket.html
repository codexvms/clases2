<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title th:text="${'Boleta ' + venta.orderId}">Boleta</title>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .ticket-card { max-width: 640px; margin: 0 auto; border: 1px solid var(--bs-border-color); padding: 24px; }
        @media print {
            body { background: #fff; }
            .no-print { display: none !important; }
            .ticket-card { border: none; padding: 0; }
        }
    </style>
</head>
<body>
<div class="no-print d-flex justify-content-end p-3">
    <button class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Imprimir</button>
</div>
<div class="ticket-card bg-body">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <h1 class="h4 fw-bold">Comprobante de venta</h1>
                <p class="text-muted mb-0">Order ID: <span th:text="${venta.orderId}"></span></p>
            </div>
            <div class="text-end">
                <p class="mb-0"><strong>Fecha:</strong> <span th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p class="mb-0"><strong>Método:</strong> <span th:text="${venta.metodoPago}"></span></p>
                <p class="mb-0"><strong>Estado:</strong> <span th:text="${venta.estadoPago}"></span></p>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-6">
                <h6 class="text-muted">Cliente</h6>
                <p class="mb-1" th:text="${venta.cliente.nombre}"></p>
                <p class="mb-0 text-muted" th:text="${venta.cliente.correo}"></p>
            </div>
            <div class="col-6 text-end">
                <h6 class="text-muted">Local</h6>
                <p class="mb-1" th:text="${venta.local.nombre}"></p>
                <p class="mb-0 text-muted" th:text="${venta.local.organizacion.nombre}"></p>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-sm align-middle">
                <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th class="text-end">Cantidad</th>
                    <th class="text-end">Precio</th>
                    <th class="text-end">Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="detalle : ${venta.detalles}">
                    <td th:text="${detalle.producto.nombre}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(detalle.cantidad, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(detalle.precioUnitario, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(detalle.totalLinea, 0, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <div class="text-end" style="min-width: 240px;">
                <div class="d-flex justify-content-between">
                    <span>Subtotal</span>
                    <span th:text="${#numbers.formatDecimal(venta.totalVenta, 0, 'COMMA', 2, 'POINT')}"></span>
                </div>
                <div class="d-flex justify-content-between">
                    <span>Descuento</span>
                    <span th:text="${#numbers.formatDecimal(venta.descuentoTotal, 0, 'COMMA', 2, 'POINT')}"></span>
                </div>
                <div class="d-flex justify-content-between border-top pt-2 mt-2">
                    <span class="fw-semibold">Total pagado</span>
                    <span class="fw-bold" th:text="${#numbers.formatDecimal(venta.montoFinal, 0, 'COMMA', 2, 'POINT')}"></span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
