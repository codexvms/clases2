<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/_head :: head"></head>
<body class="layout-body" th:attr="data-toast-success=${toastSuccess}">
<div class="d-flex" id="layout-wrapper">
    <aside th:replace="fragments/_sidebar :: sidebar"></aside>
    <div class="flex-grow-1 d-flex flex-column min-vh-100">
        <header th:replace="fragments/_topbar :: topbar"></header>
        <main class="flex-grow-1 p-3" layout:fragment="content">
            <div layout:insert="~{::content}"></div>
        </main>
        <footer th:replace="fragments/_footer :: footer"></footer>
    </div>
</div>
<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
        integrity="sha384-Ga3RtWLpmjHtkobaN6D+PfYZ7R6pujISiFDUFxIr05oig3NbS1Ry6j3Tz6kRXKuX" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
