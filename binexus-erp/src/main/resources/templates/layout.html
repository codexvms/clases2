<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head th:replace="fragments/_head :: head"></head>
<body class="bg-light">
<div class="d-flex min-vh-100" id="app-wrapper">
    <aside th:replace="fragments/_sidebar :: sidebar"></aside>
    <div class="flex-grow-1 d-flex flex-column">
        <header th:replace="fragments/_topbar :: topbar"></header>
        <main class="flex-grow-1 container-fluid py-4" layout:fragment="content">
            <div class="text-center text-muted py-5">
                <p>Contenido principal</p>
            </div>
        </main>
        <footer th:replace="fragments/_footer :: footer"></footer>
    </div>
</div>
<div th:replace="fragments/_toasts :: toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
        integrity="sha384-OOyDDDeWGPAHDq6cHklYyesqYDpPOcrPQTrWydpD5CAQfX7xux+5mIkW0gHF2Tx5"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/charts.js}"></script>
</body>
</html>
