<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout}">
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h1 th:text="${usuario.id} != null ? 'Editar usuario' : 'Crear usuario'"></h1>
            <form th:action="${usuario.id} != null ? @{'/admin/users/' + ${usuario.id}} : @{/admin/users}" th:object="${usuario}" method="post" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label" th:text="#{register.name}">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{register.email}">Correo</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{register.password}">Contraseña</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}" th:placeholder="${usuario.id} != null ? '••••••••' : ''">
                    <div class="form-text">Deja vacío para mantener la contraseña actual.</div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{form.save}">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/admin/users}" th:text="#{form.cancel}">Cancelar</a>
            </form>

            <div class="mt-4" th:if="${roles != null}">
                <h2>Roles asignados</h2>
                <ul class="list-inline">
                    <li class="list-inline-item" th:each="rol : ${roles}">
                        <span class="badge bg-secondary" th:text="${rol.nombre}">ROLE_USER</span>
                    </li>
                </ul>
                <form th:action="@{'/admin/users/' + ${usuario.id} + '/roles'}" method="post" class="row g-2">
                    <div class="col-sm-6">
                        <input type="text" name="rol" class="form-control" placeholder="ROLE_ADMIN">
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-outline-primary w-100">Asignar rol</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</html>
