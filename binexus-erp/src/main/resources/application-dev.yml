spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/binexus_erp_dev}
    username: ${DB_USER:binexus}
    password: ${DB_PASS:binexus}
  jpa:
    show-sql: true

logging:
  level:
    root: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
